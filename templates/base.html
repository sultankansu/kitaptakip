<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kitap Takip</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>
{% if session.logged_in %}
<nav class="navbar navbar-expand-lg bg-white shadow-sm mb-4">
  <div class="container-fluid px-lg-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('library') }}">📚 Kitap Takip</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <form class="d-flex mx-lg-auto search-nav my-2 my-lg-0" action="{{ url_for('search') }}" method="get">
        <input class="form-control" name="q" placeholder="Kitap, yazar veya ISBN ara" value="{{ request.args.get('q', '') }}">
      </form>
      <div class="navbar-nav gap-lg-2">
        <a class="nav-link" href="{{ url_for('library') }}">Kitaplık</a>
        <a class="nav-link" href="{{ url_for('stats') }}">İstatistik</a>
        <a class="nav-link" href="{{ url_for('settings') }}">Ayarlar</a>
        <a class="nav-link" href="{{ url_for('logout') }}">Çıkış</a>
      </div>
    </div>
  </div>
</nav>
{% endif %}
<main class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>
</html>
