{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <form accept-charset="UTF-8" class="card login-card" method="post">
    <h1 class="h4 text-center mb-4">Kitap Takip</h1>
    <label class="form-label">Kullanıcı adı</label>
    <input class="form-control mb-3" name="username" required>
    <label class="form-label">Şifre</label>
    <input class="form-control mb-4" name="password" type="password" required>
    <button class="btn btn-primary w-100">Giriş</button>
  </form>
</div>
{% endblock %}
