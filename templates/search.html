{% extends "base.html" %}
{% block content %}
<div class="d-flex align-items-center justify-content-between mb-3">
  <h1 class="h3 mb-0">Arama Sonuçları</h1>
  <button class="btn btn-outline-primary" data-bs-toggle="collapse" data-bs-target="#manualAdd">Elle ekle</button>
</div>
<div class="collapse mb-4" id="manualAdd">
  {% include "_book_form.html" %}
</div>
<div class="row g-4">
  {% for book in results %}
  <div class="col-12 col-md-6 col-lg-3">
    <article class="card book-card h-100">
      <img class="book-cover" src="{{ book.cover or default_cover }}" onerror="this.src='{{ default_cover }}'">
      <div class="card-body">
        <h2 class="h6">{{ book.title }}</h2>
        <p class="text-muted small mb-3">{{ book.author }}</p>
        <form action="{{ url_for('add_book') }}" method="post">
          <input type="hidden" name="title" value="{{ book.title }}">
          <input type="hidden" name="author" value="{{ book.author }}">
          <input type="hidden" name="publisher" value="{{ book.publisher }}">
          <input type="hidden" name="cover" value="{{ book.cover or '' }}">
          <input type="hidden" name="url" value="{{ book.url }}">
          <input type="hidden" name="status" value="want">
          {% if not book.details.page_count %}
          <input class="form-control form-control-sm mb-2" type="number" min="1" name="page_count" placeholder="Sayfa sayısını gir" required>
          {% else %}
          <input type="hidden" name="page_count" value="{{ book.details.page_count }}">
          {% endif %}
          <input type="hidden" name="isbn" value="{{ book.details.isbn or '' if book.details else '' }}">
          <input type="hidden" name="publication_year" value="{{ book.details.publication_year or '' if book.details else '' }}">
          <label class="form-label small mb-1">Kategori</label>
          <select class="form-select form-select-sm mb-2" name="category">
            {% for category in categories %}
            <option value="{{ category }}">{{ category }}</option>
            {% endfor %}
          </select>
          <div class="d-grid gap-2">
            <button class="btn btn-secondary btn-sm" name="status" value="want">Okunacak</button>
            <button class="btn btn-outline-primary btn-sm" name="status" value="reading">Okunuyor</button>
            <button class="btn btn-success btn-sm" name="status" value="finished">Okundu</button>
          </div>
        </form>
      </div>
    </article>
  </div>
  {% endfor %}
</div>
{% endblock %}
